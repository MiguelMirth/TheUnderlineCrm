[project]
name = "the-underline-automation"
version = "0.1.0"
description = "Lead discovery, enrichment, and outreach automation for The Underline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.3",
    "python-dotenv>=1.0.1",
    "google-api-python-client>=2.164.0",
    "google-auth>=2.38.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.1",
    "tavily-python>=0.5.0",
    "cursor-sdk>=0.1.0",
    "pypdf>=5.0.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3.4",
    "ruff>=0.11.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests/engine"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["web", "data", ".venv"]

[tool.ruff.lint]
# Engine code must be clean. Legacy modules are checked for real errors only (see per-file ignores).
select = ["E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["engine"]
